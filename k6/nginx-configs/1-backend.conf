# nginx-configs/1-backend.conf
# ─────────────────────────────────────────────────────────────────────────────
# CASE A: Chỉ 1 backend — dùng để đo baseline và tìm điểm bão hòa
#
# Cách dùng:
#   sudo nano /etc/nginx/sites-available/banking-api.conf
#   → Thay toàn bộ block upstream bằng nội dung dưới đây
#   → Giữ nguyên phần server { ... } bên dưới
#
# Sau khi sửa:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Kiểm tra chỉ 1 backend nhận traffic:
#   for i in {1..6}; do curl -kI https://banking-api.ngiveup.org/health | grep X-Upstream; done
# ─────────────────────────────────────────────────────────────────────────────

upstream banking_api_backend {
    least_conn;  # Gửi vào backend ít connection nhất (tốt hơn round robin khi load test)

    # Chỉ backend .50 đang active — .51 bị comment để test single-server
    server 192.168.1.50:5065 max_fails=3 fail_timeout=10s;
    # server 192.168.1.51:5065 max_fails=3 fail_timeout=10s;  # Comment để test 1 backend
    # server 192.168.1.52:5065 max_fails=3 fail_timeout=10s;  # Dự phòng cho 3 backend

    keepalive 32;
}
