# nginx-configs/2-backend.conf
# ─────────────────────────────────────────────────────────────────────────────
# CASE B: 2 backend — scale horizontal lần 1
#
# Cách dùng:
#   sudo nano /etc/nginx/sites-available/banking-api.conf
#   → Thay toàn bộ block upstream bằng nội dung dưới đây
#
# Sau khi sửa:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Xác nhận 2 backend đang nhận traffic (request phải xen kẽ):
#   for i in {1..10}; do curl -kI https://banking-api.ngiveup.org/health | grep X-Upstream; done
#   Kỳ vọng: luân phiên giữa 192.168.1.50:5065 và 192.168.1.51:5065
# ─────────────────────────────────────────────────────────────────────────────

upstream banking_api_backend {
    least_conn;  # Phân phối request vào backend ít kết nối nhất

    server 192.168.1.50:5065 max_fails=3 fail_timeout=10s;
    server 192.168.1.51:5065 max_fails=3 fail_timeout=10s;  # Backend thứ 2 đã bật
    # server 192.168.1.52:5065 max_fails=3 fail_timeout=10s;  # Dự phòng cho 3 backend

    keepalive 32;
}
