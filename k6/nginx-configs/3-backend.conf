# nginx-configs/3-backend.conf
# ─────────────────────────────────────────────────────────────────────────────
# CASE C: 3 backend — scale horizontal lần 2
#
# Điều kiện: anh cần thêm VM 192.168.1.52 cài sẵn backend API
#
# Cách dùng:
#   sudo nano /etc/nginx/sites-available/banking-api.conf
#   → Thay toàn bộ block upstream bằng nội dung dưới đây
#
# Sau khi sửa:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Xác nhận 3 backend đang nhận traffic:
#   for i in {1..15}; do curl -kI https://banking-api.ngiveup.org/health | grep X-Upstream; done
#   Kỳ vọng: request chia về cả 3: .50, .51, .52
# ─────────────────────────────────────────────────────────────────────────────

upstream banking_api_backend {
    least_conn;  # Phân phối thông minh theo số connection, không chia đều cứng nhắc

    server 192.168.1.50:5065 max_fails=3 fail_timeout=10s;
    server 192.168.1.51:5065 max_fails=3 fail_timeout=10s;
    server 192.168.1.52:5065 max_fails=3 fail_timeout=10s;  # Backend thứ 3

    # Tăng keepalive lên khi có nhiều backend hơn
    keepalive 64;
}
