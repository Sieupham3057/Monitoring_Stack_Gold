# ============================================================
# MONITORING STACK — SQL Server + ShopApi + Frontend
#
# Chạy:
#   docker compose up -d --build
#
# Dừng:
#   docker compose down
#
# Log:
#   docker compose logs -f shopapi
#   docker compose logs -f frontend
#   docker compose logs -f sqlserver
# ============================================================

services:

  # ----------------------------------------------------------
  # SQL SERVER 2022
  # ----------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: monitoring_sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "YourStrong@Passw0rd",
          "-Q",
          "SELECT 1",
          "-No"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - monitoring_net

  # ----------------------------------------------------------
  # BACKEND — ASP.NET Core 8 Web API
  # ----------------------------------------------------------
  shopapi:
    build:
      context: ./src/ShopApi
      dockerfile: Dockerfile
    container_name: monitoring_shopapi
    ports:
      - "5065:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Mornitordb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"

      Jwt__Key: "ShopApi_SuperSecretKey_2026_MustBe256BitsLongForHmacSha256!"
      Jwt__Issuer: "ShopApi"
      Jwt__Audience: "ShopApiClient"
      Jwt__ExpireMinutes: "120"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoring_net

  # ----------------------------------------------------------
  # FRONTEND — React / Vite build + Nginx
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./STRUCTURE_BASE
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Shop Admin}

        # Để rỗng nếu frontend gọi API thông qua Nginx proxy nội bộ
        VITE_API_URL: ""

        VITE_REQUEST_TIMEOUT_MS: ${VITE_REQUEST_TIMEOUT_MS:-30000}

    image: shop-admin-frontend:latest
    container_name: shop-admin-frontend
    restart: unless-stopped

    ports:
      # Truy cập frontend:
      # http://localhost:8080
      # hoặc http://192.168.1.35:8080
      - "${FRONTEND_PORT:-8080}:80"

    environment:
      # Frontend container gọi backend qua Docker network
      # Không dùng host.docker.internal nữa vì backend nằm cùng compose
      API_UPSTREAM: "http://shopapi:8080"

    depends_on:
      - shopapi

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    networks:
      - monitoring_net

# ============================================================
# VOLUMES
# ============================================================
volumes:
  sqlserver_data:
    driver: local

# ============================================================
# NETWORKS
# ============================================================
networks:
  monitoring_net:
    name: monitoring_net
    driver: bridge