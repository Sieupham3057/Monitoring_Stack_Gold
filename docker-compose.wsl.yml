# ============================================================
# MONITORING STACK — Bước 1: ShopApi + SQL Server
# Deploy lên server VMware: 192.168.1.35
#
# Chạy:  docker compose up -d --build
# Dừng:  docker compose down
# Log:   docker compose logs -f shopapi
# ============================================================

services:

  # ----------------------------------------------------------
  # SQL SERVER 2022
  # [BẮT BUỘC] ShopApi cần SQL Server để chạy
  # ----------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: monitoring_sqlserver
    environment:
      # [BẮT BUỘC] Password phải match với ConnectionString bên dưới
      SA_PASSWORD: "YourStrong@Passw0rd"
      # [BẮT BUỘC] Microsoft yêu cầu chấp nhận EULA mới chạy được
      ACCEPT_EULA: "Y"
      # [TÙY CHỌN] Developer = miễn phí, đủ tính năng Enterprise cho dev/test
      MSSQL_PID: "Developer"
    ports:
      # host_port:container_port
      # Giữ 1433 để SQL Server Management Studio kết nối trực tiếp từ máy host
      - "1433:1433"
    volumes:
      # [KHUYẾN NGHỊ] Persist data — xóa container không mất database
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # Ping SQL Server nội bộ để xác nhận đã sẵn sàng nhận kết nối
      # -No: bỏ qua TLS warning (SQL Server 2022 mặc định enforce TLS)
      test:
        - "CMD"
        - "/opt/mssql-tools18/bin/sqlcmd"
        - "-S"
        - "localhost"
        - "-U"
        - "sa"
        - "-P"
        - "YourStrong@Passw0rd"
        - "-Q"
        - "SELECT 1"
        - "-No"
      interval: 15s       # kiểm tra mỗi 15 giây
      timeout: 10s        # timeout mỗi lần kiểm tra
      retries: 5          # thử lại tối đa 5 lần trước khi báo unhealthy
      start_period: 30s   # SQL Server cần ~20-30s để khởi động lần đầu
    restart: unless-stopped
    networks:
      - monitoring_net

  # ----------------------------------------------------------
  # SHOPAPI — ASP.NET Core 8 Web API
  # ----------------------------------------------------------
  shopapi:
    build:
      context: ./src/ShopApi   # thư mục chứa Dockerfile và source code
      dockerfile: Dockerfile
    container_name: monitoring_shopapi
    ports:
      # Truy cập từ bên ngoài qua: http://192.168.1.35:5065
      # .NET 8 bên trong container lắng nghe port 8080
      - "5065:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # [BẮT BUỘC] Chỉ định rõ URL để .NET 8 lắng nghe đúng port
      ASPNETCORE_URLS: "http://+:8080"
      # Override connection string — dùng tên service "sqlserver" làm hostname
      # (Docker network tự resolve "sqlserver" → IP của container sqlserver)
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Mornitordb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      # JWT — [KHUYẾN NGHỊ] đổi key trước khi lên production thật
      Jwt__Key: "ShopApi_SuperSecretKey_2026_MustBe256BitsLongForHmacSha256!"
      Jwt__Issuer: "ShopApi"
      Jwt__Audience: "ShopApiClient"
      Jwt__ExpireMinutes: "120"
    depends_on:
      sqlserver:
        # [BẮT BUỘC] Chờ SQL Server healthy trước khi start ShopApi
        # Tránh lỗi "Cannot open database" khi SQL Server chưa sẵn sàng
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoring_net

  # ----------------------------------------------------------
  # PROMETHEUS — Thu thập & lưu metrics (time-series database)
  # [BẮT BUỘC] Bước 2: engine cốt lõi của monitoring stack
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: monitoring_prometheus
    ports:
      # UI & API: http://192.168.1.35:9090
      - "9090:9090"
    volumes:
      # [BẮT BUỘC] Mount file config — :ro = read-only để tránh container ghi đè
      - ./src/monitoring/prometheus/prometheus.wsl.yml:/etc/prometheus/prometheus.yml:ro
      # [KHUYẾN NGHỊ] Persist data — restart không mất metrics history
      - prometheus_data:/prometheus
    command:
      # [BẮT BUỘC] Chỉ định file config
      - '--config.file=/etc/prometheus/prometheus.yml'
      # [BẮT BUỘC] Thư mục lưu data trên disk
      - '--storage.tsdb.path=/prometheus'
      # [KHUYẾN NGHỊ] Giữ data 15 ngày, sau đó tự xóa để tiết kiệm disk
      - '--storage.tsdb.retention.time=15d'
      # [TÙY CHỌN] Cho phép reload config qua HTTP POST /-/reload (không cần restart)
      - '--web.enable-lifecycle'
      # [TÙY CHỌN] Bật OTLP receiver nếu muốn nhận data từ OpenTelemetry
      # - '--enable-feature=otlp-write-receiver'
    restart: unless-stopped
    networks:
      - monitoring_net

  # ----------------------------------------------------------
  # GRAFANA — Visualization layer, vẽ dashboard từ Prometheus
  # [BẮT BUỘC] Bước 3: giao diện trực quan để đọc metrics
  # Admin UI: http://192.168.1.35:3000  (admin / admin123)
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: monitoring_grafana
    ports:
      # UI: http://192.168.1.35:3000
      - "3000:3000"
    environment:
      # [BẮT BUỘC] Tài khoản admin đăng nhập lần đầu
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin123"
      # [KHUYẾN NGHỊ] Tắt đăng ký user mới qua UI — không cần trong môi trường nghiên cứu
      GF_USERS_ALLOW_SIGN_UP: "false"
      # [TÙY CHỌN] Tắt thông báo update — giữ UI gọn
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      # [KHUYẾN NGHỊ] Persist data Grafana (user, dashboard tạo tay, settings)
      - grafana_data:/var/lib/grafana
      # [BẮT BUỘC] Mount provisioning — tự động cấu hình datasource khi khởi động
      - ./src/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # [BẮT BUỘC] Mount thư mục chứa file dashboard JSON
      - ./src/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      # [BẮT BUỘC] Grafana cần Prometheus đã chạy để kiểm tra datasource
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring_net

  # ----------------------------------------------------------
  # BANKING-API — ASP.NET Core Web API
  # [TÙY CHỌN] Bỏ comment khi đã có source code thực tế tại ./src/BankingApi
  # Điều kiện:
  #   1. Thư mục ./src/BankingApi phải tồn tại và có Dockerfile
  #   2. BankingApi đã cài prometheus-net và gọi app.UseHttpMetrics()
  #   3. Sau khi bỏ comment: docker compose -f docker-compose.wsl.yml up -d banking-api
  # ----------------------------------------------------------
  # banking-api:
  #   build:
  #     context: ./src/BankingApi
  #     dockerfile: Dockerfile
  #   container_name: monitoring_banking_api
  #   ports:
  #     - "5066:8080"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: "Development"
  #     ASPNETCORE_URLS: "http://+:8080"
  #     ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BankingDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
  #   depends_on:
  #     sqlserver:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - monitoring_net

  # ----------------------------------------------------------
  # INFLUXDB 1.8 — Time-series database nhận kết quả từ K6
  # [BẮT BUỘC] Bước 5: lưu trữ metrics load test từ K6
  # K6 dùng built-in output --out influxdb=http://localhost:8086/k6
  # UI: http://localhost:8086 (không có GUI, dùng Grafana để xem)
  # ----------------------------------------------------------
  influxdb:
    image: influxdb:1.8
    container_name: monitoring_influxdb
    ports:
      # [BẮT BUỘC] Port mặc định InfluxDB
      # K6 chạy ngoài container gọi: http://localhost:8086/k6
      - "8086:8086"
    environment:
      # [BẮT BUỘC] Tạo database "k6" tự động khi container khởi động
      # K6 sẽ ghi metrics vào database này
      INFLUXDB_DB: k6
      # [KHUYẾN NGHỊ] Tắt auth cho môi trường nghiên cứu — bật lên nếu production
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
      # [TÙY CHỌN] Giữ data 30 ngày rồi tự xóa (tiết kiệm disk)
      INFLUXDB_DATA_MAX_VALUES_PER_TAG: "0"
    volumes:
      # [KHUYẾN NGHỊ] Persist data — restart không mất kết quả load test
      - influxdb_data:/var/lib/influxdb
    restart: unless-stopped
    networks:
      - monitoring_net

  # ----------------------------------------------------------
  # cADVISOR — Container Advisor, thu thập metrics của Docker
  # [BẮT BUỘC] Bước 2: nguồn metrics container cho Prometheus
  # Tự động phát hiện tất cả container đang chạy trên host
  # ----------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: monitoring_cadvisor
    ports:
      # UI: http://192.168.1.35:8080 / localhost:8080 (WSL2)
      - "8080:8080"
    command:
      # [BẮT BUỘC - WSL2 với containerd-snapshotter]
      # WSL2 Docker Engine bật "containerd-snapshotter" theo mặc định → Docker lưu layer
      # theo format containerd (overlayfs), KHÔNG có thư mục layerdb/mounts/ truyền thống.
      # → cAdvisor Docker factory tìm file mount-id → "no such file" → container không tạo được.
      #
      # Giải pháp: dùng containerd factory (gRPC API) thay vì Docker factory (đọc file layerdb).
      # containerd factory lấy info container qua containerd socket → không cần layerdb.
      # namespace "moby" = nơi Docker lưu container trong containerd (không phải k8s.io).
      - '--containerd=/var/run/containerd/containerd.sock'
      - '--containerd-namespace=moby'
    volumes:
      # [BẮT BUỘC] cAdvisor cần đọc thông tin từ host OS để lấy metrics
      - /:/rootfs:ro                        # filesystem gốc của host
      # [QUAN TRỌNG - WSL2] Chỉ mount containerd.sock trực tiếp (writable) để gRPC kết nối được.
      # KHÔNG mount /var/run hay docker.sock — nếu docker.sock tồn tại trong container (dù là :ro),
      # Docker factory vẫn có thể kết nối Unix socket và sẽ register, sau đó fail vì không có layerdb.
      # → Không có docker.sock → Docker factory không register → containerd factory xử lý tất cả.
      - /var/run/containerd/containerd.sock:/var/run/containerd/containerd.sock
      - /sys:/sys:ro                        # thông tin kernel, cgroups
      - /sys/fs/cgroup:/sys/fs/cgroup:ro   # [BẮT BUỘC nếu cgroup v2] cgroup v2 hierarchy
      - /var/lib/docker/:/var/lib/docker:ro # metadata các container
      - /dev/disk/:/dev/disk:ro             # thông tin disk I/O
    # [BẮT BUỘC] cAdvisor cần quyền truy cập sâu vào kernel
    privileged: true
    devices:
      - /dev/kmsg   # đọc kernel message buffer để lấy OOM events
    restart: unless-stopped
    networks:
      - monitoring_net

# ============================================================
# VOLUMES — lưu trữ persistent data ngoài container lifecycle
# Xóa container vẫn giữ nguyên data
# ============================================================
volumes:
  sqlserver_data:
    driver: local
  # [BẮT BUỘC] Bước 2: lưu metrics của Prometheus
  prometheus_data:
    driver: local
  # [BẮT BUỘC] Bước 3: lưu cấu hình và dashboard của Grafana
  grafana_data:
    driver: local
  # [BẮT BUỘC] Bước 5: lưu kết quả load test K6 của InfluxDB
  influxdb_data:
    driver: local

# ============================================================
# NETWORKS — mạng nội bộ riêng cho monitoring stack
# Các service giao tiếp với nhau qua tên service (DNS nội bộ)
# Bên ngoài chỉ access được qua ports đã expose
# ============================================================
networks:
  monitoring_net:
    driver: bridge
