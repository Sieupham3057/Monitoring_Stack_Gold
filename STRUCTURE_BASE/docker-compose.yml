services:
  frontend:
    container_name: shop-admin-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Shop Admin}
        VITE_API_URL: ""
        VITE_REQUEST_TIMEOUT_MS: ${VITE_REQUEST_TIMEOUT_MS:-30000}
    image: shop-admin-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:5065}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - shop-network

networks:
  shop-network:
    name: shop-network
